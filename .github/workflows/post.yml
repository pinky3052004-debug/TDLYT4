name: Make Post Image

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "12:01 | 16:30"
        type: choice
        options: ["12:01", "16:30"]
        default: "12:01"
      force:
        description: "ပိတ်ရက်/စနေ တနင်္ဂနွေမှာလည်း စမ်းမယ် (test - private အဖြစ်တင်)"
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Make post image and upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 make_post.py "${{ inputs.slot }}" --upload ${{ inputs.force && '--force' || '' }}

      - name: Save image (backup)
        if: always() && hashFiles('posts/*.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: post-${{ inputs.slot == '12:01' && '1201' || '1630' }}-${{ github.run_number }}
          path: |
            posts/*.png
            posts/*.mp4
            posts/*.txt
